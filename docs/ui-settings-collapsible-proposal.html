<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suo 设置页折叠式编辑方案</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      --page: #091121;
      --surface: #101a30;
      --field: #161f39;
      --text: #f4f6ff;
      --muted: #8996b4;
      --subtle: #65718d;
      --line: rgba(139, 151, 190, .16);
      --accent: #8a78ff;
      --green: #65dca9;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--text);
      background: #050a14;
    }
    button, input, select, textarea { font: inherit; }
    .window {
      width: min(1040px, calc(100vw - 36px));
      height: min(720px, calc(100vh - 36px));
      min-height: 600px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--page);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .42);
    }
    .titlebar {
      height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: #0c1528;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .brand b { color: var(--accent); font-size: 20px; }
    .prototype-label {
      padding: 5px 9px;
      border-radius: 999px;
      color: #b8afea;
      background: rgba(138, 120, 255, .12);
      font-size: 10px;
    }
    .layout { display: grid; grid-template-columns: 156px 1fr; height: calc(100% - 52px); }
    aside { padding: 18px 12px; border-right: 1px solid var(--line); background: #0a1120; }
    aside button {
      width: 100%;
      margin-bottom: 4px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      color: var(--subtle);
      background: transparent;
      text-align: left;
    }
    aside button.active { color: var(--text); background: rgba(138, 120, 255, .23); }
    main { min-width: 0; padding: 25px 28px 40px; overflow: auto; }
    .heading { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .heading p { margin: 0; color: var(--subtle); font-size: 11px; }
    .save {
      align-self: flex-start;
      height: 34px;
      padding: 0 15px;
      border: 1px solid rgba(163, 151, 255, .6);
      border-radius: 9px;
      color: white;
      background: #5547aa;
    }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
    .segments { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #0c1529; }
    .segments button {
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      color: var(--subtle);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .segments button.active { color: var(--text); background: var(--surface); }
    .add {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent);
      background: transparent;
      font-size: 11px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .list { display: grid; gap: 9px; }
    .item {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      transition: border-color 140ms ease;
    }
    .item.open { border-color: rgba(138, 120, 255, .55); }
    .summary {
      width: 100%;
      min-height: 70px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px 28px;
      align-items: center;
      border-bottom: 1px solid transparent;
    }
    .item.open .summary { border-bottom-color: var(--line); }
    .summary-main {
      min-width: 0;
      min-height: 70px;
      padding: 12px 8px 12px 14px;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(101, 220, 169, .55); }
    .dot.off { background: #59647d; box-shadow: none; }
    .summary-copy { min-width: 0; }
    .title-line { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .title-line strong { font-size: 13px; }
    code, .badge { padding: 3px 7px; border-radius: 6px; font-size: 9px; }
    code { color: #bdb4ff; background: rgba(138, 120, 255, .13); }
    .description { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .badges { display: flex; gap: 6px; }
    .badge { color: var(--muted); border: 1px solid var(--line); }
    .enable-switch {
      position: relative;
      display: grid;
      width: 52px;
      height: 42px;
      place-items: center;
      cursor: pointer;
    }
    .enable-switch input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .enable-switch span {
      position: relative;
      width: 32px;
      height: 18px;
      border: 1px solid rgba(139, 151, 190, .32);
      border-radius: 999px;
      background: #29334a;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .enable-switch span::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #9aa6bd;
      transition: left 140ms ease, background 140ms ease;
    }
    .enable-switch input:checked + span { border-color: rgba(138, 120, 255, .7); background: rgba(106, 89, 207, .64); }
    .enable-switch input:checked + span::after { left: 16px; background: white; }
    .enable-switch input:focus-visible + span { outline: 2px solid rgba(138, 120, 255, .55); outline-offset: 2px; }
    .chevron-button {
      width: 28px;
      height: 42px;
      padding: 0;
      border: 0;
      color: var(--subtle);
      background: transparent;
      cursor: pointer;
    }
    .chevron { display: inline-block; transition: transform 140ms ease; }
    .item.open .chevron { transform: rotate(180deg); }
    .item.disabled .summary-copy, .item.disabled .badges { opacity: .5; }
    .editor { display: none; padding: 0 14px 14px 35px; }
    .item.open .editor { display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; }
    label { display: grid; gap: 6px; color: var(--subtle); font-size: 9px; }
    label.wide { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: var(--field);
    }
    input, select { height: 34px; padding: 0 10px; }
    textarea { min-height: 64px; padding: 9px 10px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: rgba(138, 120, 255, .7); }
    .editor-actions { display: flex; justify-content: space-between; margin-top: 14px; }
    .editor-actions button { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 10px; }
    .danger { border: 1px solid rgba(222, 97, 118, .25); color: #e78c9a; background: transparent; }
    .right-actions { display: flex; gap: 8px; }
    .cancel { border: 1px solid var(--line); color: var(--muted); background: transparent; }
    .done { border: 1px solid rgba(138, 120, 255, .55); color: white; background: #5547aa; }
    .hint { margin-top: 12px; color: var(--subtle); font-size: 9px; text-align: right; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 125px 1fr; }
      main { padding: 20px; }
      .grid { grid-template-columns: 1fr; }
      label.wide { grid-column: auto; }
      .badges { display: none; }
      .summary { grid-template-columns: minmax(0, 1fr) 48px 26px; }
      .summary-main { grid-template-columns: 9px minmax(0, 1fr); }
      .enable-switch { width: 48px; }
    }
  </style>
</head>
<body>
  <section class="window">
    <header class="titlebar">
      <div class="brand"><b>◇</b><strong>Suo 设置</strong></div>
      <span class="prototype-label">交互原型 · 不会保存</span>
    </header>
    <div class="layout">
      <aside>
        <button>通用</button><button>搜索与索引</button><button class="active">命令与服务</button><button>外观</button>
      </aside>
      <main>
        <div class="heading">
          <div><h1>命令与服务</h1><p>默认只显示摘要；点击某一项后展开编辑，同一时间仅编辑一项。</p></div>
          <button class="save">保存设置</button>
        </div>
        <div class="toolbar">
          <div class="segments">
            <button class="active" data-panel="scripts">脚本命令</button>
            <button data-panel="web">网络搜索</button>
            <button data-panel="services">服务</button>
          </div>
          <button class="add">＋ 添加当前类型</button>
        </div>

        <section class="panel active" id="scripts">
          <div class="list">
            <article class="item open">
              <div class="summary">
                <button type="button" class="summary-main"><span class="dot"></span><span class="summary-copy"><span class="title-line"><strong>时间戳转换</strong><code>ts</code></span><span class="description">将毫秒时间戳转换为本地日期时间，适合日志排查。</span></span><span class="badges"><span class="badge">Python</span><span class="badge">50 ms 后执行</span></span></button>
                <label class="enable-switch" title="启用时间戳转换"><input type="checkbox" checked aria-label="启用时间戳转换" /><span></span></label>
                <button type="button" class="chevron-button" aria-label="展开时间戳转换"><span class="chevron">⌄</span></button>
              </div>
              <div class="editor">
                <div class="grid">
                  <label>名称<input value="时间戳转换" /></label><label>关键词<input value="ts" /></label>
                  <label class="wide">描述 / 使用说明<textarea>将毫秒时间戳转换为本地日期时间，示例：ts 1786082576069</textarea></label>
                  <label>运行时<select><option>Python</option></select></label><label>别名<input placeholder="逗号分隔" /></label>
                  <label class="wide">脚本路径<input value="examples/timestamp.py" /></label>
                  <label>超时（ms）<input value="3000" /></label><label>执行方式<select><option>输入停顿后执行</option><option>按 Enter 执行</option></select></label>
                  <label>执行延迟（ms，最低 20）<input type="number" min="20" value="50" /></label>
                </div>
                <div class="editor-actions"><button class="danger">删除</button><div class="right-actions"><button class="cancel">取消</button><button class="done">完成编辑</button></div></div>
              </div>
            </article>
            <article class="item"><div class="summary"><button type="button" class="summary-main"><span class="dot"></span><span class="summary-copy"><span class="title-line"><strong>格式化 JSON</strong><code>json</code></span><span class="description">整理剪贴板或输入参数中的 JSON 文本。</span></span><span class="badges"><span class="badge">PowerShell</span><span class="badge">按 Enter</span></span></button><label class="enable-switch" title="启用格式化 JSON"><input type="checkbox" checked aria-label="启用格式化 JSON" /><span></span></label><button type="button" class="chevron-button" aria-label="展开格式化 JSON"><span class="chevron">⌄</span></button></div><div class="editor"><div class="grid"><label>名称<input value="格式化 JSON" /></label><label>关键词<input value="json" /></label><label class="wide">描述 / 使用说明<textarea>整理剪贴板或输入参数中的 JSON 文本。</textarea></label></div><div class="editor-actions"><button class="danger">删除</button><div class="right-actions"><button class="cancel">取消</button><button class="done">完成编辑</button></div></div></div></article>
          </div>
        </section>

        <section class="panel" id="web">
          <div class="list">
            <article class="item"><div class="summary"><button type="button" class="summary-main"><span class="dot"></span><span class="summary-copy"><span class="title-line"><strong>Google 搜索</strong><code>google</code></span><span class="description">使用默认浏览器在 Google 中搜索输入内容。</span></span><span class="badges"><span class="badge">网络搜索</span></span></button><label class="enable-switch" title="启用 Google 搜索"><input type="checkbox" checked aria-label="启用 Google 搜索" /><span></span></label><button type="button" class="chevron-button" aria-label="展开 Google 搜索"><span class="chevron">⌄</span></button></div><div class="editor"><div class="grid"><label>名称<input value="Google 搜索" /></label><label>关键词<input value="google" /></label><label class="wide">描述 / 使用说明<textarea>使用默认浏览器在 Google 中搜索输入内容。</textarea></label><label class="wide">URL 模板（{query} 整段；{query0}/{query1} 分参数）<input value="https://www.google.com.hk/search?q={query}" /></label></div><div class="editor-actions"><button class="danger">删除</button><div class="right-actions"><button class="cancel">取消</button><button class="done">完成编辑</button></div></div></div></article>
            <article class="item"><div class="summary"><button type="button" class="summary-main"><span class="dot"></span><span class="summary-copy"><span class="title-line"><strong>百度搜索</strong><code>bd</code></span><span class="description">使用默认浏览器在百度中搜索输入内容。</span></span><span class="badges"><span class="badge">网络搜索</span></span></button><label class="enable-switch" title="启用百度搜索"><input type="checkbox" checked aria-label="启用百度搜索" /><span></span></label><button type="button" class="chevron-button" aria-label="展开百度搜索"><span class="chevron">⌄</span></button></div><div class="editor"><div class="grid"><label>名称<input value="百度搜索" /></label><label>关键词<input value="bd" /></label><label class="wide">描述 / 使用说明<textarea>使用默认浏览器在百度中搜索输入内容。</textarea></label><label class="wide">URL 模板（{query} 整段；{query0}/{query1} 分参数）<input value="https://www.baidu.com/s?wd={query}" /></label></div><div class="editor-actions"><button class="danger">删除</button><div class="right-actions"><button class="cancel">取消</button><button class="done">完成编辑</button></div></div></div></article>
          </div>
        </section>

        <section class="panel" id="services">
          <div class="list">
            <article class="item"><div class="summary"><button type="button" class="summary-main"><span class="dot"></span><span class="summary-copy"><span class="title-line"><strong>Microsoft Translator</strong><code>fy</code></span><span class="description">中英文自动识别翻译；API 密钥存放在系统凭据库。</span></span><span class="badges"><span class="badge">密钥已配置</span></span></button><label class="enable-switch" title="启用 Microsoft Translator"><input type="checkbox" checked aria-label="启用 Microsoft Translator" /><span></span></label><button type="button" class="chevron-button" aria-label="展开 Microsoft Translator"><span class="chevron">⌄</span></button></div><div class="editor"><div class="grid"><label>关键词<input value="fy" /></label><label>区域<input value="eastasia" /></label><label class="wide">描述 / 使用说明<textarea>中英文自动识别翻译；示例：fy hello 或 fy:ja hello</textarea></label><label class="wide">API 密钥<input type="password" value="••••••••••••" /></label></div><div class="editor-actions"><button class="danger">清除密钥</button><div class="right-actions"><button class="cancel">取消</button><button class="done">完成编辑</button></div></div></div></article>
          </div>
        </section>
        <p class="hint">“完成编辑”只更新页面草稿；右上角“保存设置”才持久化全部改动。</p>
      </main>
    </div>
  </section>
  <script>
    const segments = [...document.querySelectorAll('.segments button')];
    const panels = [...document.querySelectorAll('.panel')];
    segments.forEach((button) => button.addEventListener('click', () => {
      segments.forEach((item) => item.classList.toggle('active', item === button));
      panels.forEach((panel) => panel.classList.toggle('active', panel.id === button.dataset.panel));
    }));
    const requestedPanel = new URLSearchParams(window.location.search).get('panel');
    const requestedButton = segments.find((button) => button.dataset.panel === requestedPanel);
    if (requestedButton) requestedButton.click();
    document.addEventListener('click', (event) => {
      const trigger = event.target.closest('.summary-main, .chevron-button');
      if (!trigger) return;
      const selected = trigger.closest('.item');
      document.querySelectorAll('.item.open').forEach((item) => {
        if (item !== selected) item.classList.remove('open');
      });
      selected.classList.toggle('open');
    });
    document.querySelectorAll('.enable-switch input').forEach((input) => input.addEventListener('change', () => {
      const item = input.closest('.item');
      item.classList.toggle('disabled', !input.checked);
      item.querySelector('.dot').classList.toggle('off', !input.checked);
      if (!input.checked) item.classList.remove('open');
    }));
    document.querySelectorAll('.cancel, .done').forEach((button) => button.addEventListener('click', () => button.closest('.item').classList.remove('open')));
  </script>
</body>
</html>
